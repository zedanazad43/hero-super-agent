name: Deploy Hero Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/check/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Worker contract
        run: npm run verify
      - name: Deploy canonical Worker
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Run public Worker smoke checks
        run: npm run smoke:prod
        env:
          HERO_WORKER_URL: https://hero-super-agent.zedanazad43.workers.dev
